function closeModal(confirmed){const m=modalAction;if(!m)return;$('modal').hidden=true;modalAction=null;game.paused=wasPaused;if(confirmed)m.action();else if(m.cancelAction)m.cancelAction();if(previousFocus&&document.contains(previousFocus))previousFocus.focus();render();save();fitMap();}
$('modal-confirm').addEventListener('click',()=>closeModal(true));$('modal-cancel').addEventListener('click',()=>closeModal(false));$('modal').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeModal(false);}if(e.key==='Tab'){const nodes=[...$('modal').querySelectorAll('button,a,select,input,[tabindex="0"]')].filter(n=>!n.hidden&&!n.disabled);const i=nodes.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();nodes.at(-1).focus();}else if(!e.shiftKey&&i===nodes.length-1){e.preventDefault();nodes[0].focus();}}});
$('help').addEventListener('click',()=>showModal('站長手冊',`<div class="help-grid"><section><strong>從三格支線到完整供應鏈</strong><p>1. 在 A 林場與 B 鋸木廠之間點 3 格鋪軌。<br>2. 切到「車隊」，買木材線列車，按「開始」。<br>3. 回「合約」查看目標，達標後按領獎進下一單。原版四份合約採累計，其後每單只計新交貨。</p></section><section><strong>三章、16 份合約</strong><p>山谷篇建立木材、農場與鋼鐵；工業篇加入機具、集市、果園；遠洋篇挑戰罐頭配方、出口、精簡路網及多元運輸。通關後有四種輪替長期委託。</p></section><section><strong>貨物與加工</strong><p>原料每 3 秒生產 1 箱，投資後 2 箱。送達木材／礦石即轉成木板／鋼材。工坊使用 1 木板 + 1 鋼材做機具；罐頭廠使用 2 鮮果 + 1 穀物做罐頭。不同路線可能共用貨源。庫存滿時多餘入貨不再儲存；回庫歸還的貨物可暫時超出上限。</p></section><section><strong>列車、會車、轉轍</strong><p>每台 $160、起始載重 4 箱。工業篇可升級車廂至 8 箱、引擎兩次共提速 70%。「等滿載」節省共線班次；「有貨即發」減少等料。優先發車先取得空路段，已發車的列車不受影響。</p><p>全段預約防止對撞，車站提供免費會車側線。共線繁忙時可另鋪路、回庫換線；三岔路口用轉轍工具切換封閉出口。回庫與拆軌全額退款，升級也退；產業投資可點選撤回退款，既有庫存不會消失；原料持續生產，沒有燃料費或破產倒數。</p></section><section><strong>鍵盤與小螢幕</strong><p>1 / 2 / 3 選鋪軌、轉轍、拆除；P 暫停；+ 調速；H 打開手冊；Esc 關閉視窗。地圖用方向鍵、Enter 操作，管理分頁用左右鍵切換。小螢幕地圖可上下左右滑動，點「專注地圖」可暫收管理面板。極矮螢幕可使用專注模式或橫向捲動面板。</p></section><section><strong>存檔</strong><p>每 5 秒與操作後本機存檔。載入時暫停，列車回起站，未送貨物退回，沒有離線生產。舊版進度會接續為第一章或第二章，舊版存檔仍保留。損壞存檔不會自動覆寫；重新開局前會再次確認。</p></section></div>`));
$('log').addEventListener('click',()=>showModal('營運紀錄',game.logs.length?game.logs.map(x=>`<div class="log-row"><span class="tag">營運 ${Math.floor(x.time/60)} 分</span><br>${escapeHTML(x.text)}</div>`).join(''):'<p>完成合約後，里程碑會記在這裡。三章不設期限，慢慢把路網接起來。</p>'));
$('view-campaign').addEventListener('click',()=>showModal('三章鐵道旅程',CONTRACTS.map((c,i)=>`<div class="log-row"><span class="tag">${i<4?'山谷篇':i<10?'工業篇':'遠洋篇'} · ${String(i+1).padStart(2,'0')} ${i<game.stage?'✓ 已完成':i===game.stage?'← 進行中':''}</span><br><strong>${c.title}</strong><br><span class="small">${c.unlock||''}</span></div>`).join('')+'<p>通關後開啟四種輪替長期委託，所有建設保留。</p>'));
$('restart').addEventListener('click',()=>showModal('重新開一座小鎮？','<p>這會取代長線版本的路網、車隊與合約進度，從 $420 開始。若有原版存檔，原版備份仍會保留。</p>','重新開始',()=>{storageBlocked=false;game=new RailGame();selectedRoute='wood';$('route-select').value='wood';setTool('rail');chooseTab('contract');say('新小鎮準備好了。先接通 A → B。');draw();},'保留進度'));
$('focus-map').addEventListener('click',()=>{const on=document.body.classList.toggle('map-focus');$('focus-map').setAttribute('aria-pressed',String(on));$('focus-map').textContent=on?'返回管理':'專注地圖';fitMap();});
for(const k of ['rail','switch','erase'])$('tool-'+k).addEventListener('click',()=>setTool(k));$('pause').addEventListener('click',()=>{game.paused=!game.paused;say(game.paused?'營運已暫停，可安心規劃。':'列車開始營運。達標後記得到合約面板領獎。');render();save();});$('speed').addEventListener('click',()=>{game.speed=game.speed===4?1:game.speed*2;render();save();});$('route-select').addEventListener('change',e=>{selectedRoute=e.target.value;render();draw();});$('buy').addEventListener('click',()=>act(()=>game.buy(selectedRoute)));$('claim').addEventListener('click',()=>act(()=>game.claim()));
document.addEventListener('keydown',e=>{if(modalAction||e.ctrlKey||e.metaKey||e.altKey||['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;const k=e.key.toLowerCase();if(['1','2','3'].includes(k)){setTool(['rail','switch','erase'][Number(k)-1]);e.preventDefault();}else if(k==='p'){$('pause').click();e.preventDefault();}else if(k==='+'){$('speed').click();e.preventDefault();}else if(k==='h'){$('help').click();e.preventDefault();}});
window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden)save();});if(loaded)say(game.migrated?'已接續舊進度，原版備份仍保留。列車回到起站、未送貨物歸還；按開始繼續。':'進度已載入。列車安全返回起站，未送貨物已歸還；按開始繼續。');render();draw();fitMap();save();function frame(now){if(!last)last=now;const elapsed=document.hidden?0:Math.min(.1,(now-last)/1000);last=now;let remain=elapsed*game.speed;while(remain>0){const dt=Math.min(.1,remain);game.tick(dt);remain-=dt;}saveClock+=elapsed;uiClock+=elapsed;if(uiClock>.25){render();uiClock=0;}if(saveClock>5){save();saveClock=0;}draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
}
</script></body></html>
