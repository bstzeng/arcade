<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>多格拼板 · Arcade</title><link rel="stylesheet" href="./polyomino/style.css?v=1"><script src="./polyomino/levels.js?v=1" defer></script><script src="./polyomino/engine.js?v=1" defer></script><script src="./polyomino/app.js?v=1" defer></script></head><body><main class="app"><header><a href="../index.html">← 遊戲大廳</a><h1>多格拼板</h1><label>關卡 <select id="level" aria-label="選擇關卡"></select></label><button id="help">玩法</button></header><div class="stats"><span id="tier"></span><span id="moves"></span><span id="progress"></span><span id="timer"></span></div><div class="layout"><section class="play" aria-label="遊戲棋盤"><div id="board" class="board"></div></section><aside class="side"><div id="demoBar" hidden>解答示範中，不改動你的進度 <button id="exitDemo">離開示範</button></div><h2>配置拼片</h2><p class="intro">先選拼片，再點棋盤放置。再次點已放好的拼片可取回。</p><div id="palette" class="palette"></div><div class="toolbar" style="margin-top:10px"><button id="rotate">旋轉 ↻</button><button id="flip">翻面 ⇄</button></div><div class="hint">把每片形狀拼進棋盤，不重疊、不留空。<br><span id="tip">50 個已驗證關卡。進度儲存在本機瀏覽器。</span></div></aside></div><footer><div class="toolbar"><button id="undo">撤銷</button><button id="restart">重玩</button><button id="hint">提示一步</button><button id="solution">解答示範</button><button id="next">下一關 →</button></div><p id="status" role="status" aria-live="polite"></p></footer></main><dialog id="helpDialog"><h2>玩法與驗證</h2><p>先選拼片，再點棋盤格作為拼片外接矩形的左上角。旋轉與翻面都合法；點已放置的拼片即可拿回。必須用完全部拼片，覆蓋所有非障礙格。部分關卡可能有多種解，任何合法完整拼法都算過關。</p><p>鍵盤可用 Tab 切換格子，Enter／空白鍵操作。提示以參考解為準；拼板已有其他拼法時可先撤銷再使用提示。解答示範不覆蓋你的棋局。</p><button onclick="this.closest('dialog').close()">知道了</button></dialog><dialog id="confirmDialog"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="toolbar"><button id="cancelConfirm">取消</button><button id="acceptConfirm">確定</button></div></dialog></body></html>
