<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17695e"><title>解開繩結｜邏輯遊戲室</title><link rel="stylesheet" href="untangle/style.css"></head><body><main class="shell"><header><div><a class="brand" href="../index.html">邏輯遊戲室 / LOGIC ARCADE</a><div class="titleline"><span class="emblem">⌘</span><div><h1>解開繩結</h1><p class="subtitle">UNTANGLE · 理出線條的秩序</p></div></div></div><a class="home" href="../index.html">← 返回遊戲室</a></header><section class="stats" aria-label="遊戲資訊"><div><small>當前關卡</small><strong id="levelNumber">01</strong><span>/ 50</span></div><div><small id="metricLabel">目前狀態</small><strong id="metric">0</strong><span id="metricUnit"></span></div><div><small>移動次數</small><strong id="moves">0</strong></div><div><small>已完成</small><strong id="completed">0</strong><span>/ 50</span></div></section><div class="layout"><section class="stage"><div class="stage-top"><span id="variant" class="badge"></span><span>移動節點，讓每一條線各得其所</span></div><div class="boardfield"><div id="board" class="board" aria-label="解開繩結棋盤"></div></div><div id="win" class="win" hidden>漂亮！這一關完成了 🎉</div><p id="message" class="message" role="status" aria-live="polite"></p></section><aside><section class="panel chooser"><p class="eyebrow">YOUR NEXT CHALLENGE</p><label for="level">選擇關卡</label><select id="level"></select><div class="row"><button id="prev">← 上一關</button><button id="next">下一關 →</button></div><p id="levelInfo" class="note"></p></section><section class="panel controls"><button id="undo">↶ 撤銷</button><button id="reset">重新開始</button><button id="hint" class="primary">小提示</button><button id="solution">解答觀摩</button><button id="help" class="wide">怎麼玩？</button></section><section class="guide"><h2>留一點空間給思考</h2><p>拖曳編號節點，讓所有線段不交叉。共用同一個端點是合法的；節點重疊、壓在線段上及線段重疊都不算完成。</p><span id="saveNote" class="note">進度自動儲存在此瀏覽器</span></section></aside></div><footer><span>50 關 · 每關附可重現驗證</span><span>提示與觀摩不改動你的進度</span></footer></main><dialog id="modal"><div class="dialoghead"><h2 id="modalTitle"></h2><button id="cancel" aria-label="關閉視窗">返回</button></div><div id="modalBody"></div><div class="dialogactions"><button id="confirm" class="primary" hidden>確認重新開始</button></div></dialog><script src="untangle/levels.js"></script><script src="untangle/engine.js"></script><script src="untangle/app.js"></script></body></html>
