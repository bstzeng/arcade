<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182c35"><meta name="description" content="競叫地主，或與另一位農民合作，搶先出完牌。完整規則、公平AI、同機傳遞與100個經驗證指定牌局。"><title>鬥地主｜遊戲小宇宙</title><link rel="icon" href="../favicon.svg"><link rel="stylesheet" href="./dou-dizhu/style.css"></head>
<body data-game="dou-dizhu"><header><div class="brand" id="brand" aria-hidden="true"></div><div><div class="eyebrow" id="english"></div><div class="title"><h1 id="title"></h1><span class="badge">經典牌桌</span></div><p id="tagline"></p></div><a class="back" href="../index.html">← 遊戲大廳</a></header>
<main><div class="topbar"><label class="field">遊玩模式<select id="mode"><option value="ai">與 AI 對戰</option><option value="local">同機多人</option><option value="challenge">100 指定牌局</option></select></label><label class="field" id="difficulty-field">AI 難度<select id="difficulty"><option value="easy">入門</option><option value="normal" selected>標準</option></select></label><div class="spacer"></div><button id="new-deal">開新場</button><button id="help">玩法與完整規則</button></div>
<div class="layout"><div class="play-area"><div class="status" id="status" role="status" aria-live="polite"></div><div class="privacy-wrap" id="privacy-wrap"><section class="table" aria-label="遊戲牌桌"><div class="table-content"><div class="players" id="players"></div><div class="center" id="center"></div><div class="open-hands" id="open-hands"></div></div></section><section class="section hand-section"><div class="hand-header"><h2 id="hand-title">你的手牌</h2><small id="hand-note"></small></div><div class="cards hand" id="hand" aria-label="可選手牌"></div><div class="actions" id="actions"></div></section><div class="veil hidden" id="privacy"><span class="eyebrow">PRIVATE HAND</span><h2 id="privacy-title"></h2><p>把裝置交給下一位，再揭開自己的手牌。<br>切換分頁或按 Escape 會重新遮牌。</p><button class="primary" id="reveal">我是這一席，揭開手牌</button></div></div>
<div class="toolbar"><button id="undo">撤銷</button><button id="restart">重開牌局</button><button id="hint">提示</button><button id="replay">解答重播</button><button id="stop" disabled>停止</button><button id="continue" class="hidden">繼續</button><button id="hide">暫停 / 遮牌</button><button id="next" class="primary">下一副</button></div><p class="muted" id="variant"></p></div>
<aside><section class="section" id="challenge-box"><h2>100 個指定牌局</h2><div class="goal" id="level-goal"></div><p class="muted" id="progress"></p><div class="levels" id="levels" aria-label="選擇指定牌局"></div><div class="scope" id="challenge-scope"></div></section><section class="section"><h2>一分鐘上手</h2><p class="muted" id="intro"></p><ol id="steps"></ol><div class="scope" id="scope-live"></div></section><section class="section"><h2 id="round-label">本場積分</h2><div id="scores"></div><p class="muted">積分僅供遊戲記錄；沒有兌換或付款。</p></section></aside></div></main>
<footer><span>ARCADE · 經典牌桌 / DOU DIZHU</span><span id="save-state"></span></footer><dialog id="rules"><div class="dialog-title"><h2>完整規則與地方變體</h2><button id="close-help" aria-label="關閉規則">關閉 ✕</button></div><div class="rules" id="rules-content"></div></dialog>

<script src="./cards80-common/engine.js"></script>
<script src="./cards80-common/session.js"></script>
