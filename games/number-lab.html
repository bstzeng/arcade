<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12141b"><title>數字實驗室 · arcade</title><style>
:root{color-scheme:dark;--bg:#12141b;--panel:#1b1e28;--line:#343846;--muted:#a5aaba;--lime:#d2f86a;--lav:#b6a5fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 25%,#302a46 0, var(--bg) 65%);color:#f4f5f8;font:16px/1.7 system-ui,-apple-system,"Noto Sans TC",sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible,#board:focus-visible{outline:3px solid var(--lime);outline-offset:4px}.wrap{max-width:960px;margin:auto;padding:28px 24px 48px}header{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px;border-bottom:1px solid var(--line);font-size:13px}header span{color:var(--muted)}.intro{margin:32px 0 22px}.eyebrow{color:var(--lav);font-size:11px;letter-spacing:3px;margin:0}h1{font-size:clamp(30px,6vw,43px);line-height:1.25;margin:10px 0}p{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:32px;align-items:start}.stats{display:flex;gap:10px;margin-bottom:15px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 18px;flex:1}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:24px;font-variant-numeric:tabular-nums}.board-wrap{position:relative}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px;border:1px solid #534966;background:#242331;border-radius:18px;touch-action:none;aspect-ratio:1;user-select:none}.tile{display:grid;place-items:center;border-radius:11px;background:#33313f;font-size:clamp(23px,5vw,45px);font-weight:800;color:#2c2540;line-height:1;box-shadow:inset 0 1px #ffffff12}.tile[data-v="2"]{background:#e2dafa}.tile[data-v="4"]{background:#cdbbf6}.tile[data-v="8"]{background:#b19be9}.tile[data-v="16"]{background:#9275d5;color:white}.tile[data-v="32"]{background:#7855b7;color:white}.tile[data-v="64"]{background:#62449b;color:white}.tile[data-v="128"]{background:#f4d790;font-size:34px}.tile[data-v="256"]{background:#ebc06c;font-size:34px}.tile[data-v="512"]{background:#eead66;font-size:34px}.tile[data-v="1024"],.tile[data-v="2048"]{background:var(--lime);font-size:29px}.tile.high{background:#b0e9d2;font-size:25px}.tile.new{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.65)}to{transform:scale(1)}}#overlay{position:absolute;inset:0;border-radius:18px;background:#17151de8;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;backdrop-filter:blur(4px)}#overlay h2{font-size:30px;margin:0;color:var(--lime)}#overlay p{margin:12px 0 20px}button{border:1px solid var(--line);background:#2b2d39;color:#fff;padding:10px 18px;border-radius:8px;font-weight:650}.primary{background:var(--lime);border-color:var(--lime);color:#243019}.actions{display:flex;gap:10px;flex-wrap:wrap}aside{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}aside h2{font-size:18px;margin-top:0}aside p{font-size:14px}.legend{display:flex;align-items:center;gap:10px;margin:24px 0}.legend b{display:grid;place-items:center;width:45px;height:45px;border-radius:8px;background:#d2c3ef;color:#372b50}.legend b:last-child{background:var(--lime)}.pad{display:grid;grid-template-columns:repeat(3,48px);gap:6px;justify-content:center;margin:20px auto 12px}.pad button{padding:8px;font-size:20px}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1}.status{font-size:13px;min-height:25px;color:var(--lav);margin:12px 0}footer{color:var(--muted);font-size:12px;margin-top:22px}[hidden]{display:none!important}@media(max-width:740px){.layout{grid-template-columns:1fr;gap:20px}.wrap{max-width:520px;padding:20px 18px 35px}.intro{margin-top:23px}.intro p{font-size:14px}aside{padding:18px}aside .pad{margin:14px auto}.tile[data-v="128"],.tile[data-v="256"],.tile[data-v="512"]{font-size:27px}.tile[data-v="1024"],.tile[data-v="2048"]{font-size:23px}.tile.high{font-size:19px}#board{gap:8px;padding:9px}.stat{padding:8px 14px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main class="wrap"><header><a href="../index.html">← 回到遊戲大廳</a><span>arcade / 01</span></header><section class="intro"><p class="eyebrow">NUMBER LAB · 2048</p><h1>數字實驗室</h1><p>讓相同的數字相遇，一步一步，合成 2048。</p></section><div class="layout"><section aria-label="2048 遊戲"><div class="stats"><div class="stat"><small>本局分數</small><strong id="score">0</strong></div><div class="stat"><small>最高紀錄</small><strong id="best">0</strong></div></div><div class="board-wrap"><div id="board" tabindex="0" role="group" aria-label="4 乘 4 數字棋盤，使用方向鍵移動"></div><div id="overlay" hidden><h2 id="result"></h2><p id="resultText"></p><div class="actions"><button id="continue" class="primary">繼續挑戰</button><button id="again">再玩一次</button></div></div></div><p class="status" id="status" role="status" aria-live="polite">方向鍵、WASD 或滑動棋盤開始</p><button id="restart">↻ 重新開始</button></section><aside><h2>把靈感，往同一邊推</h2><div class="legend"><b>2</b><span>＋</span><b>2</b><span>→</span><b>4</b></div><p>每次移動，所有方塊一起滑向指定方向。相同數字相遇便合成，每個方塊每回合只合成一次。</p><p>有效移動後會出現一個 2 或 4。合成的數字會加到分數；棋盤無法再移動時，本局結束。</p><div class="pad" aria-label="方向控制"><button data-dir="up" aria-label="向上">↑</button><button data-dir="left" aria-label="向左">←</button><button data-dir="down" aria-label="向下">↓</button><button data-dir="right" aria-label="向右">→</button></div><p>小提示：試著把最大的數字留在角落。</p></aside></div><footer>隨時玩一局，不用登入 · 最高分儲存在此瀏覽器</footer><noscript>請啟用 JavaScript 來玩這個遊戲。</noscript></main><script>
'use strict';
function slideLine(line){const nums=line.filter(Boolean),out=[];let points=0;for(let i=0;i<nums.length;i++){if(nums[i]===nums[i+1]){out.push(nums[i]*2);points+=nums[i]*2;i++;}else out.push(nums[i]);}while(out.length<4)out.push(0);return {line:out,points};}
function movedBoard(source,dir){const out=source.slice();let points=0;for(let n=0;n<4;n++){let ids=[];for(let k=0;k<4;k++)ids.push(dir==='left'?n*4+k:dir==='right'?n*4+3-k:dir==='up'?k*4+n:(3-k)*4+n);const result=slideLine(ids.map(i=>source[i]));points+=result.points;ids.forEach((id,k)=>out[id]=result.line[k]);}return{board:out,points,changed:out.some((v,i)=>v!==source[i])};}
function canMove(b){return b.includes(0)||b.some((v,i)=>(i%4<3&&v===b[i+1])||(i<12&&v===b[i+4]));}
const $=id=>document.getElementById(id);let board=[],score=0,best=0,won=false,paused=false,newIndex=-1;try{best=Number(localStorage.getItem('arcade-2048-best'))||0;}catch(e){}
function spawn(){const empty=board.map((v,i)=>v===0?i:-1).filter(i=>i>=0);if(empty.length){newIndex=empty[Math.floor(Math.random()*empty.length)];board[newIndex]=Math.random()<.9?2:4;}}
function draw(){const el=$('board');el.replaceChildren();board.forEach((v,i)=>{const tile=document.createElement('div');tile.className='tile'+(v>2048?' high':'')+(i===newIndex?' new':'');tile.dataset.v=v;tile.textContent=v||'';tile.setAttribute('aria-label',`第 ${Math.floor(i/4)+1} 列，第 ${i%4+1} 格：${v||'空格'}`);el.append(tile);});$('score').textContent=score;$('best').textContent=best;}
function showResult(win){paused=true;$('overlay').hidden=false;$('result').textContent=win?'2048，實驗成功！':'這一局，收穫滿滿';$('resultText').textContent=win?'你已合成 2048！要繼續挑戰更大的數字嗎？':`沒有可移動的空間了。本局得到 ${score} 分。`;$('continue').hidden=!win;$('status').textContent=win?'成功合成 2048！':'遊戲結束';}
function move(dir){if(paused)return;const next=movedBoard(board,dir);if(!next.changed){if(!canMove(board))showResult(false);return;}board=next.board;score+=next.points;if(score>best){best=score;try{localStorage.setItem('arcade-2048-best',String(best));}catch(e){}}spawn();draw();$('status').textContent=next.points?`漂亮的合成！＋${next.points} 分`:'找找下一個可以合成的數字';if(!won&&board.some(v=>v>=2048)){won=true;showResult(true);}else if(!canMove(board))showResult(false);}
function reset(){board=Array(16).fill(0);score=0;won=false;paused=false;spawn();spawn();$('overlay').hidden=true;$('status').textContent='方向鍵、WASD 或滑動棋盤開始';draw();}
$('restart').onclick=reset;$('again').onclick=reset;$('continue').onclick=()=>{paused=false;$('overlay').hidden=true;$('board').focus();if(!canMove(board))showResult(false);};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(b.dataset.dir));document.addEventListener('keydown',e=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};if(e.altKey||e.ctrlKey||e.metaKey)return;const dir=map[e.key]||map[e.key.toLowerCase()];if(dir){e.preventDefault();move(dir);}});let start=null;$('board').addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY,id:e.pointerId};$('board').setPointerCapture(e.pointerId);});$('board').addEventListener('pointerup',e=>{if(!start||start.id!==e.pointerId)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));});$('board').addEventListener('pointercancel',()=>start=null);reset();
</script></body></html>
