</style></head><body><main class="compact-shell game-number-lab"><header class="app-head"><div class="app-identity"><a href="../index.html">← 遊戲大廳</a><h1>數字實驗室</h1></div><div class="app-tools"><button id="restart">↻ 重開</button><button id="helpOpen" class="help-open" type="button" aria-haspopup="dialog" aria-controls="gameHelp">玩法 / 更多</button></div></header><div class="play-layout"><section class="play-main" aria-label="數字實驗室遊戲"><div class="stats"><div class="stat"><small>本局分數</small><strong id="score">0</strong></div><div class="stat"><small>最高紀錄</small><strong id="best">0</strong></div></div><div class="board-space"><div class="board-wrap"><div id="board" tabindex="0" role="group" aria-label="4 乘 4 數字棋盤，使用方向鍵移動"></div><div id="overlay" hidden><h2 id="result"></h2><p id="resultText"></p><div class="actions"><button id="continue" class="primary">繼續挑戰</button><button id="again">再玩一次</button></div></div></div></div><p class="status" id="status" role="status" aria-live="polite">方向鍵、WASD 或滑動棋盤開始</p></section><aside class="control-panel" aria-label="遊戲控制"><h2>移動方塊</h2><div class="pad" aria-label="方向控制"><button data-dir="up" aria-label="向上">↑</button><button data-dir="left" aria-label="向左">←</button><button data-dir="down" aria-label="向下">↓</button><button data-dir="right" aria-label="向右">→</button></div><p class="control-note">方向鍵、WASD 或滑動棋盤。最大的數字，試著留在角落。</p></aside></div><dialog id="gameHelp" class="help-dialog" aria-labelledby="helpTitle"><div class="help-head"><h2 id="helpTitle">數字實驗室 · 玩法與更多</h2><button id="helpClose" class="help-close" type="button" autofocus="autofocus">關閉</button></div><div class="help-content"><p class="eyebrow">NUMBER LAB · 2048</p><p>讓相同的數字相遇，一步一步，合成 2048。</p><aside><h2>把靈感，往同一邊推</h2><div class="legend"><b>2</b><span>＋</span><b>2</b><span>→</span><b>4</b></div><p>每次移動，所有方塊一起滑向指定方向。相同數字相遇便合成，每個方塊每回合只合成一次。</p><p>有效移動後會出現一個 2 或 4。合成的數字會加到分數；棋盤無法再移動時，本局結束。</p><p>小提示：試著把最大的數字留在角落。</p></aside><footer>隨時玩一局，不用登入 · 最高分儲存在此瀏覽器</footer></div></dialog><noscript>請啟用 JavaScript 來玩這個遊戲。</noscript></main><script>
'use strict';
function slideLine(line){const nums=line.filter(Boolean),out=[];let points=0;for(let i=0;i<nums.length;i++){if(nums[i]===nums[i+1]){out.push(nums[i]*2);points+=nums[i]*2;i++;}else out.push(nums[i]);}while(out.length<4)out.push(0);return {line:out,points};}
function movedBoard(source,dir){const out=source.slice();let points=0;for(let n=0;n<4;n++){let ids=[];for(let k=0;k<4;k++)ids.push(dir==='left'?n*4+k:dir==='right'?n*4+3-k:dir==='up'?k*4+n:(3-k)*4+n);const result=slideLine(ids.map(i=>source[i]));points+=result.points;ids.forEach((id,k)=>out[id]=result.line[k]);}return{board:out,points,changed:out.some((v,i)=>v!==source[i])};}
function canMove(b){return b.includes(0)||b.some((v,i)=>(i%4<3&&v===b[i+1])||(i<12&&v===b[i+4]));}
const $=id=>document.getElementById(id);let board=[],score=0,best=0,won=false,paused=false,newIndex=-1;try{best=Number(localStorage.getItem('arcade-2048-best'))||0;}catch(e){}
function spawn(){const empty=board.map((v,i)=>v===0?i:-1).filter(i=>i>=0);if(empty.length){newIndex=empty[Math.floor(Math.random()*empty.length)];board[newIndex]=Math.random()<.9?2:4;}}
function draw(){const el=$('board');el.replaceChildren();board.forEach((v,i)=>{const tile=document.createElement('div');tile.className='tile'+(v>2048?' high':'')+(i===newIndex?' new':'');tile.dataset.v=v;tile.textContent=v||'';tile.setAttribute('aria-label',`第 ${Math.floor(i/4)+1} 列，第 ${i%4+1} 格：${v||'空格'}`);el.append(tile);});$('score').textContent=score;$('best').textContent=best;}
function showResult(win){paused=true;$('overlay').hidden=false;$('result').textContent=win?'2048，實驗成功！':'這一局，收穫滿滿';$('resultText').textContent=win?'你已合成 2048！要繼續挑戰更大的數字嗎？':`沒有可移動的空間了。本局得到 ${score} 分。`;$('continue').hidden=!win;$('status').textContent=win?'成功合成 2048！':'遊戲結束';}
function move(dir){if(paused)return;const next=movedBoard(board,dir);if(!next.changed){if(!canMove(board))showResult(false);return;}board=next.board;score+=next.points;if(score>best){best=score;try{localStorage.setItem('arcade-2048-best',String(best));}catch(e){}}spawn();draw();$('status').textContent=next.points?`漂亮的合成！＋${next.points} 分`:'找找下一個可以合成的數字';if(!won&&board.some(v=>v>=2048)){won=true;showResult(true);}else if(!canMove(board))showResult(false);}
function reset(){board=Array(16).fill(0);score=0;won=false;paused=false;spawn();spawn();$('overlay').hidden=true;$('status').textContent='方向鍵、WASD 或滑動棋盤開始';draw();}
$('restart').onclick=reset;$('again').onclick=reset;$('continue').onclick=()=>{paused=false;$('overlay').hidden=true;$('board').focus();if(!canMove(board))showResult(false);};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(b.dataset.dir));document.addEventListener('keydown',e=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};if(e.altKey||e.ctrlKey||e.metaKey)return;const dir=map[e.key]||map[e.key.toLowerCase()];if(dir){e.preventDefault();move(dir);}});let start=null;$('board').addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY,id:e.pointerId};$('board').setPointerCapture(e.pointerId);});$('board').addEventListener('pointerup',e=>{if(!start||start.id!==e.pointerId)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));});$('board').addEventListener('pointercancel',()=>start=null);reset();
</script><script>

/* Layout-only behavior; the original game engine above is unchanged. */
(()=>{
 const shell=document.querySelector('.compact-shell'),help=document.getElementById('gameHelp'),opener=document.getElementById('helpOpen');
 opener.addEventListener('click',()=>{
  if(shell.classList.contains('game-quick-spark')&&(phase==='waiting'||phase==='ready')){clearPending();phase='paused';show('','Ⅱ','這回合暫停了','關閉說明後，點擊重新等待信號');announce('開啟說明時已暫停，關閉後請點擊重試本回合。');}
  help.showModal();
 });
 document.getElementById('helpClose').addEventListener('click',()=>help.close());
 help.addEventListener('close',()=>opener.focus({preventScroll:true}));
 help.addEventListener('click',e=>{if(e.target===help){const r=help.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)help.close();}});
 // Stop global gameplay shortcuts while a native modal has focus. Its own keyboard defaults still work.
 document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]'))e.stopImmediatePropagation();},true);
 const space=document.querySelector('.board-space');
 if(space){
  const board=space.querySelector('#board,#maze'),target=space.firstElementChild;
  const fit=()=>{
   const w=space.clientWidth,h=space.clientHeight;
   if(!w||!h)return;
   let size=Math.min(w,h);
   if(shell.classList.contains('game-memory-match')){
    const style=getComputedStyle(board),cols=style.gridTemplateColumns.split(' ').length,rows=Math.ceil(board.children.length/cols),gap=parseFloat(style.gap)||0;
    size=Math.min(w,Math.max(0,h-gap*(rows-1))/Math.max(rows,1)*1.12*cols+gap*(cols-1));
   }
   target.style.setProperty('--board-size',Math.floor(size)+'px');
  };
  new ResizeObserver(fit).observe(space);
  new MutationObserver(fit).observe(board,{childList:true});
  window.addEventListener('resize',fit);fit();
 }
 const finish=document.getElementById('finish'),result=document.getElementById('resultDialog');
 if(finish&&result){
  const sync=()=>{if(!finish.hidden&&!result.open)result.showModal();else if(finish.hidden&&result.open)result.close();};
  new MutationObserver(sync).observe(finish,{attributes:true,attributeFilter:['hidden']});
  result.addEventListener('cancel',e=>{e.preventDefault();document.getElementById('continue').click();});
  sync();
 }
})();

</script></body></html>
