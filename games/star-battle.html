<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星星之戰 Star Battle｜邏輯遊樂場</title><link rel="stylesheet" href="star-battle/style.css"></head><body>
<header><a href="../index.html">← 回遊戲大廳</a><span class="brand">LOGIC / CONSTELLATIONS</span><span class="saved" id="saveStatus">進度自動儲存</span></header>
<main><section class="sidebar"><div class="eyebrow">02 / MAKE ROOM FOR STARS</div><h1>星星之戰</h1><p class="intro">讓每一顆星，保有自己的距離。<br>用列、欄與區域，找到唯一的星空。</p><div class="tags"><span>Star Battle</span><span>50 關 · 唯一解</span><span>含 10 關雙星</span></div>
<div class="picker"><label for="levelSelect">選擇挑戰</label><div class="selectrow"><button id="prev" class="nav" aria-label="上一關">‹</button><select id="levelSelect" aria-label="選擇關卡"></select><button id="next" class="nav" aria-label="下一關">›</button></div><p class="completion" id="completion"></p><div class="progress"><i id="progress"></i></div></div>
<div class="actions"><button id="undo">↶ 復原</button><button id="reset">重新開始</button><button id="hint">一點提示</button><button id="solution">查看解答</button><button id="check" class="primary wide">檢查星空</button></div><button id="help" class="helpbtn">ⓘ 規則與操作方式</button><p class="legend">點擊依序切換：空白 → 星星 → ×。<br>× 是你的筆記，不影響完成判定。<br>不同區域以底色、粗線與編號區分。</p></section>
<section class="playarea" id="playarea"><div class="boardtop"><span id="levelTitle" class="leveltitle"></span><span id="boardMeta"></span></div><div class="modebar"><button data-mode="cycle" class="selected">循環標記</button><button data-mode="star">★ 放星星</button><button data-mode="cross">× 做筆記</button></div><div class="starframe" id="starframe"><div class="colcounts" id="colcounts"></div><div class="rowcounts" id="rowcounts"></div><div id="board" class="board starboard" role="group" aria-label="星星之戰棋盤"></div></div><div id="regions" class="regions"></div><div id="status" class="status" role="status" aria-live="polite"></div><div class="note" id="note">每列、每欄、每個粗線區域都要指定星數 · 星星不能相鄰或斜角相碰</div></section></main>
<div class="overlay" id="modal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><div id="modalBody"></div><footer><button id="cancelModal">取消</button><button id="confirmModal" class="primary">確定</button></footer></section></div>
<script src="star-battle/levels.js"></script><script src="star-battle/engine.js"></script><script src="star-battle/app.js"></script></body></html>
