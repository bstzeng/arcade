<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">磁暴前線：河口防線</title>
<desc id="desc">原創等角軍事工業插畫。青藍磁環基地在風暴前集結，履帶裝甲與步兵沿河岸前進，橙銅敵軍隔橋對峙，晶礦照亮補給線。</desc>
