<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>數字環線 · Arcade</title><link rel="stylesheet" href="./slitherlink/style.css?v=1"><script src="./slitherlink/levels.js?v=1" defer></script><script src="./slitherlink/engine.js?v=1" defer></script><script src="./slitherlink/app.js?v=1" defer></script></head><body><main class="app"><header><a href="../index.html">← 遊戲大廳</a><h1>數字環線</h1><label>關卡 <select id="level" aria-label="選擇關卡"></select></label><button id="help">玩法</button></header><div class="stats"><span id="tier"></span><span id="moves"></span><span id="progress"></span><span id="timer"></span></div><div class="layout"><section class="play" aria-label="遊戲棋盤"><div id="board" class="board"></div></section><aside class="side"><div id="demoBar" hidden>解答示範中，不改動你的進度 <button id="exitDemo">離開示範</button></div><h2>畫出唯一的環</h2><p class="intro">點邊線依序切換：線段 → 叉號 → 空白。數字表示四周使用的線段數，空白格沒有數量限制。</p><p>所有線段必須連成一個環，不能分叉或交叉。</p><p id="result"></p><div class="hint">沿格線畫出一條完整封閉環。<br><span id="tip">50 個已驗證關卡。進度儲存在本機瀏覽器。</span></div></aside></div><footer><div class="toolbar"><button id="undo">撤銷</button><button id="restart">重玩</button><button id="hint">提示一步</button><button id="solution">解答示範</button><button id="next">下一關 →</button></div><p id="status" role="status" aria-live="polite"></p></footer></main><dialog id="helpDialog"><h2>玩法與驗證</h2><p>每格數字表示其四條邊中有幾條屬於環線。每個接點只能連 0 或 2 條邊，而且整個盤面只能有一條非空封閉環。叉號只是你的筆記。每關已用完整搜尋驗證恰有一個解。</p><p>鍵盤可用 Tab 切換格子，Enter／空白鍵操作。提示以參考解為準；拼板已有其他拼法時可先撤銷再使用提示。解答示範不覆蓋你的棋局。</p><button onclick="this.closest('dialog').close()">知道了</button></dialog><dialog id="confirmDialog"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="toolbar"><button id="cancelConfirm">取消</button><button id="acceptConfirm">確定</button></div></dialog></body></html>
