</style></head><body><main class="compact-shell game-maze-walk"><header class="app-head"><div class="app-identity"><a href="../index.html">← 遊戲大廳</a><h1>迷宮漫步</h1></div><div class="app-tools"><button id="restart">↻ 重走</button><button id="helpOpen" class="help-open" type="button" aria-haspopup="dialog" aria-controls="gameHelp">玩法 / 更多</button></div></header><div class="play-layout"><section class="play-main" aria-label="迷宮漫步遊戲"><div class="stats"><div class="stat"><small>關卡</small><strong id="level">1</strong></div><div class="stat"><small>探索時間</small><strong id="time">00:00</strong></div><div class="stat"><small>移動步數</small><strong id="moves">0</strong></div></div><div class="board-space"><div class="maze-wrap"><canvas id="maze" tabindex="0" role="img" aria-label="迷宮，綠色圓點是你，右下角金色方格是出口。方向鍵移動。"></canvas><div id="overlay" hidden><h2>找到出口了！</h2><p id="result"></p><button id="next" class="primary">下一關 →</button></div></div></div><p class="status" id="status" role="status" aria-live="polite">從左上角出發，前往右下角的出口</p></section><aside class="control-panel" aria-label="遊戲控制"><div class="settings-group"><label for="difficulty">迷宮大小</label><select id="difficulty"><option value="0">輕鬆漫步 · 8 × 8 起</option><option value="1">小小冒險 · 12 × 12 起</option><option value="2">深度探索 · 16 × 16 起</option></select></div><div class="pad" aria-label="方向控制"><button data-dir="0" aria-label="向上">↑</button><button data-dir="3" aria-label="向左">←</button><button data-dir="2" aria-label="向下">↓</button><button data-dir="1" aria-label="向右">→</button></div><label class="toggle"><input type="checkbox" id="trail" checked>顯示走過的足跡</label></aside></div><dialog id="gameHelp" class="help-dialog" aria-labelledby="helpTitle"><div class="help-head"><h2 id="helpTitle">迷宮漫步 · 玩法與更多</h2><button id="helpClose" class="help-close" type="button" autofocus="autofocus">關閉</button></div><div class="help-content"><p class="eyebrow">MAZE WALK · FIND YOUR WAY</p><p>轉個彎，也許就是出口。每一次出發，都有新的風景。</p><button id="newMaze">換一座迷宮</button><aside><h2>慢慢走，也能抵達</h2><div class="legend"><span><i></i>你的位置</span><span><i></i>終點</span></div><p>使用方向鍵、WASD、下方按鈕或在迷宮上滑動。碰到牆壁不會增加步數。</p><p>每座迷宮都保證有解。過關後地圖逐漸變大；換大小會從第 1 關重新出發。</p><p id="record" class="record"></p></aside><footer>不設時間限制 · 計時從第一步開始，切換分頁時暫停</footer></div></dialog><noscript>請啟用 JavaScript 來玩這個遊戲。</noscript></main><script>
'use strict';
const DX=[0,1,0,-1],DY=[-1,0,1,0];
function generateMaze(n,random=Math.random){const cells=Array.from({length:n*n},()=>[true,true,true,true]),seen=new Set([0]),stack=[0];while(stack.length){const at=stack[stack.length-1],x=at%n,y=Math.floor(at/n),choices=[];for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d],id=ny*n+nx;if(nx>=0&&nx<n&&ny>=0&&ny<n&&!seen.has(id))choices.push([d,id]);}if(!choices.length){stack.pop();continue;}const [d,id]=choices[Math.floor(random()*choices.length)];cells[at][d]=false;cells[id][(d+2)%4]=false;seen.add(id);stack.push(id);}return cells;}
function stepPosition(cells,n,pos,d){if(cells[pos][d])return pos;return pos+DX[d]+DY[d]*n;}
const $=id=>document.getElementById(id),canvas=$('maze'),ctx=canvas.getContext('2d');let cells,n,level=1,difficulty=0,pos=0,moves=0,elapsed=0,lastTick=performance.now(),started=false,finished=false,visited=new Set(),records={};try{records=JSON.parse(localStorage.getItem('arcade-maze-records'))||{};if(typeof records!=='object'||Array.isArray(records))records={};}catch(e){}
function formatTime(ms){const sec=Math.floor(ms/1000);return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;}
function clock(now=performance.now()){if(started&&!finished&&!document.hidden)elapsed+=Math.max(0,now-lastTick);lastTick=now;$('time').textContent=formatTime(elapsed);}
function draw(){const size=600;const ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=size*ratio;canvas.height=size*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle='#202720';ctx.fillRect(0,0,size,size);const pad=12,cell=(size-pad*2)/n;ctx.lineWidth=Math.max(2,cell*.06);ctx.strokeStyle='#a49d80';ctx.lineCap='square';if($('trail').checked){ctx.fillStyle='#455239';visited.forEach(id=>{ctx.beginPath();ctx.arc(pad+(id%n+.5)*cell,pad+(Math.floor(id/n)+.5)*cell,cell*.1,0,Math.PI*2);ctx.fill();});}const ex=pad+(n-1)*cell,ey=pad+(n-1)*cell;ctx.fillStyle='#ead7ab';ctx.fillRect(ex+cell*.22,ey+cell*.22,cell*.56,cell*.56);ctx.fillStyle='#665e44';ctx.fillRect(ex+cell*.43,ey+cell*.35,cell*.15,cell*.32);ctx.beginPath();cells.forEach((walls,id)=>{const x=pad+(id%n)*cell,y=pad+Math.floor(id/n)*cell;if(walls[0]){ctx.moveTo(x,y);ctx.lineTo(x+cell,y);}if(walls[3]){ctx.moveTo(x,y);ctx.lineTo(x,y+cell);}if(id%n===n-1&&walls[1]){ctx.moveTo(x+cell,y);ctx.lineTo(x+cell,y+cell);}if(id>=n*(n-1)&&walls[2]){ctx.moveTo(x,y+cell);ctx.lineTo(x+cell,y+cell);}});ctx.stroke();ctx.fillStyle='#d2f86a';ctx.beginPath();ctx.arc(pad+(pos%n+.5)*cell,pad+(Math.floor(pos/n)+.5)*cell,cell*.27,0,Math.PI*2);ctx.fill();ctx.fillStyle='#36432a';ctx.beginPath();ctx.arc(pad+(pos%n+.57)*cell,pad+(Math.floor(pos/n)+.45)*cell,cell*.045,0,Math.PI*2);ctx.fill();canvas.setAttribute('aria-label',`${n} 乘 ${n} 迷宮，目前第 ${Math.floor(pos/n)+1} 列、第 ${pos%n+1} 格。出口在第 ${n} 列、第 ${n} 格。`);}
function updateRecord(){const r=records[n];$('record').textContent=r?`${n} × ${n} 最快紀錄：${formatTime(r)}（隨機地圖）`:'這個大小的最快紀錄，等你來留下。';}
function resetPlayer(){pos=0;moves=0;elapsed=0;lastTick=performance.now();started=false;finished=false;visited=new Set([0]);$('moves').textContent=0;$('time').textContent='00:00';$('level').textContent=level;$('overlay').hidden=true;$('status').textContent=`${n} × ${n} 迷宮：從左上角出發，前往右下角的出口`;updateRecord();draw();}
function newGame(){n=Math.min(24,[8,12,16][difficulty]+(level-1)*2);cells=generateMaze(n);resetPlayer();}
function move(d){if(finished)return;const next=stepPosition(cells,n,pos,d);if(next===pos){$('status').textContent='這裡有牆，試試另一個方向';return;}clock();started=true;pos=next;moves++;visited.add(pos);$('moves').textContent=moves;$('status').textContent=`目前第 ${Math.floor(pos/n)+1} 列、第 ${pos%n+1} 格`;draw();if(pos===n*n-1){clock();finished=true;if(!records[n]||elapsed<records[n]){records[n]=Math.max(1,Math.round(elapsed));try{localStorage.setItem('arcade-maze-records',JSON.stringify(records));}catch(e){}}$('result').textContent=`第 ${level} 關完成！用時 ${formatTime(elapsed)}，走了 ${moves} 步。`;$('status').textContent='恭喜找到出口！可以挑戰下一關了';$('overlay').hidden=false;updateRecord();}}
$('restart').onclick=resetPlayer;$('newMaze').onclick=newGame;$('next').onclick=()=>{level++;newGame();};$('difficulty').onchange=e=>{difficulty=Number(e.target.value);level=1;newGame();};$('trail').onchange=draw;document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(Number(b.dataset.dir)));document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.altKey||e.ctrlKey||e.metaKey)return;const map={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3};const d=map[e.key]??map[e.key.toLowerCase()];if(d!==undefined){e.preventDefault();move(d);}});let start=null;canvas.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointerup',e=>{if(!start||start.id!==e.pointerId)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));});canvas.addEventListener('pointercancel',()=>start=null);document.addEventListener('visibilitychange',()=>{lastTick=performance.now();});setInterval(clock,200);newGame();
</script><script>

/* Layout-only behavior; the original game engine above is unchanged. */
(()=>{
 const shell=document.querySelector('.compact-shell'),help=document.getElementById('gameHelp'),opener=document.getElementById('helpOpen');
 opener.addEventListener('click',()=>{
  if(shell.classList.contains('game-quick-spark')&&(phase==='waiting'||phase==='ready')){clearPending();phase='paused';show('','Ⅱ','這回合暫停了','關閉說明後，點擊重新等待信號');announce('開啟說明時已暫停，關閉後請點擊重試本回合。');}
  help.showModal();
 });
 document.getElementById('helpClose').addEventListener('click',()=>help.close());
 help.addEventListener('close',()=>opener.focus({preventScroll:true}));
 help.addEventListener('click',e=>{if(e.target===help){const r=help.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)help.close();}});
 // Stop global gameplay shortcuts while a native modal has focus. Its own keyboard defaults still work.
 document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]'))e.stopImmediatePropagation();},true);
 const space=document.querySelector('.board-space');
 if(space){
  const board=space.querySelector('#board,#maze'),target=space.firstElementChild;
  const fit=()=>{
   const w=space.clientWidth,h=space.clientHeight;
   if(!w||!h)return;
   let size=Math.min(w,h);
   if(shell.classList.contains('game-memory-match')){
    const style=getComputedStyle(board),cols=style.gridTemplateColumns.split(' ').length,rows=Math.ceil(board.children.length/cols),gap=parseFloat(style.gap)||0;
    size=Math.min(w,Math.max(0,h-gap*(rows-1))/Math.max(rows,1)*1.12*cols+gap*(cols-1));
   }
   target.style.setProperty('--board-size',Math.floor(size)+'px');
  };
  new ResizeObserver(fit).observe(space);
  new MutationObserver(fit).observe(board,{childList:true});
  window.addEventListener('resize',fit);fit();
 }
 const finish=document.getElementById('finish'),result=document.getElementById('resultDialog');
 if(finish&&result){
  const sync=()=>{if(!finish.hidden&&!result.open)result.showModal();else if(finish.hidden&&result.open)result.close();};
  new MutationObserver(sync).observe(finish,{attributes:true,attributeFilter:['hidden']});
  result.addEventListener('cancel',e=>{e.preventDefault();document.getElementById('continue').click();});
  sync();
 }
})();

</script></body></html>
