<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12141b"><title>迷宮漫步 · arcade</title><style>
:root{color-scheme:dark;--bg:#12141b;--panel:#1b1e28;--line:#343846;--muted:#a5aaba;--lime:#d2f86a;--sand:#ead7ab}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 20%,#323127,var(--bg) 65%);color:#f4f5f8;font:16px/1.7 system-ui,-apple-system,"Noto Sans TC",sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}button,select{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible,select:focus-visible,canvas:focus-visible{outline:3px solid var(--lime);outline-offset:4px}.wrap{max-width:1000px;margin:auto;padding:28px 24px 48px}header{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px;border-bottom:1px solid var(--line);font-size:13px}header span{color:var(--muted)}.intro{margin:32px 0 22px}.eyebrow{color:var(--sand);font-size:11px;letter-spacing:3px;margin:0}h1{font-size:clamp(30px,6vw,43px);line-height:1.25;margin:10px 0}p{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:30px;align-items:start}.stats{display:flex;gap:10px;margin-bottom:15px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 15px;flex:1}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:22px;font-variant-numeric:tabular-nums}.maze-wrap{position:relative;border-radius:18px;padding:12px;background:#262923;border:1px solid #51513f}canvas{display:block;width:100%;aspect-ratio:1;border-radius:7px;touch-action:none}#overlay{position:absolute;inset:0;border-radius:18px;background:#171d18ed;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;backdrop-filter:blur(3px)}#overlay h2{font-size:30px;margin:0;color:var(--lime)}#overlay p{margin:12px 0 20px}button,select{border:1px solid var(--line);background:#2b2d39;color:#fff;padding:10px 15px;border-radius:8px;font-weight:650}.primary{background:var(--lime);border-color:var(--lime);color:#243019}.actions{display:flex;gap:10px;flex-wrap:wrap}aside{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}aside h2{font-size:18px;margin-top:0}aside p{font-size:14px}.legend{font-size:13px;display:flex;gap:15px;flex-wrap:wrap;margin:14px 0}.legend i{display:inline-block;width:10px;height:10px;background:var(--lime);border-radius:50%;margin-right:5px}.legend span:last-child i{background:var(--sand);border-radius:2px}.pad{display:grid;grid-template-columns:repeat(3,51px);gap:7px;justify-content:center;margin:22px auto}.pad button{padding:9px;font-size:20px}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1}.status{font-size:13px;min-height:25px;color:var(--sand);margin:12px 0}label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}select{width:100%}.toggle{display:flex;gap:9px;align-items:center;margin-top:18px;color:#ddd;font-size:13px}input{accent-color:var(--lime);width:17px;height:17px}footer{color:var(--muted);font-size:12px;margin-top:22px}.record{font-size:12px!important;margin-bottom:0}[hidden]{display:none!important}@media(max-width:740px){.layout{grid-template-columns:1fr;gap:20px}.wrap{max-width:550px;padding:20px 18px 35px}.intro{margin-top:23px}.intro p{font-size:14px}aside{padding:18px}.stat{padding:8px 11px}.stat strong{font-size:20px}.maze-wrap{padding:8px}.pad{margin:15px auto}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main class="wrap"><header><a href="../index.html">← 回到遊戲大廳</a><span>arcade / 02</span></header><section class="intro"><p class="eyebrow">MAZE WALK · FIND YOUR WAY</p><h1>迷宮漫步</h1><p>轉個彎，也許就是出口。每一次出發，都有新的風景。</p></section><div class="layout"><section aria-label="迷宮遊戲"><div class="stats"><div class="stat"><small>關卡</small><strong id="level">1</strong></div><div class="stat"><small>探索時間</small><strong id="time">00:00</strong></div><div class="stat"><small>移動步數</small><strong id="moves">0</strong></div></div><div class="maze-wrap"><canvas id="maze" tabindex="0" role="img" aria-label="迷宮，綠色圓點是你，右下角金色方格是出口。方向鍵移動。"></canvas><div id="overlay" hidden><h2>找到出口了！</h2><p id="result"></p><button id="next" class="primary">下一關 →</button></div></div><p class="status" id="status" role="status" aria-live="polite">從左上角出發，前往右下角的出口</p><div class="actions"><button id="restart">↻ 重走這座迷宮</button><button id="newMaze">換一座迷宮</button></div></section><aside><h2>慢慢走，也能抵達</h2><label for="difficulty">迷宮大小</label><select id="difficulty"><option value="0">輕鬆漫步 · 8 × 8 起</option><option value="1">小小冒險 · 12 × 12 起</option><option value="2">深度探索 · 16 × 16 起</option></select><div class="legend"><span><i></i>你的位置</span><span><i></i>終點</span></div><p>使用方向鍵、WASD、下方按鈕或在迷宮上滑動。碰到牆壁不會增加步數。</p><div class="pad" aria-label="方向控制"><button data-dir="0" aria-label="向上">↑</button><button data-dir="3" aria-label="向左">←</button><button data-dir="2" aria-label="向下">↓</button><button data-dir="1" aria-label="向右">→</button></div><label class="toggle"><input type="checkbox" id="trail" checked>顯示走過的足跡</label><p>每座迷宮都保證有解。過關後地圖逐漸變大；換大小會從第 1 關重新出發。</p><p id="record" class="record"></p></aside></div><footer>不設時間限制 · 計時從第一步開始，切換分頁時暫停</footer><noscript>請啟用 JavaScript 來玩這個遊戲。</noscript></main><script>
'use strict';
const DX=[0,1,0,-1],DY=[-1,0,1,0];
function generateMaze(n,random=Math.random){const cells=Array.from({length:n*n},()=>[true,true,true,true]),seen=new Set([0]),stack=[0];while(stack.length){const at=stack[stack.length-1],x=at%n,y=Math.floor(at/n),choices=[];for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d],id=ny*n+nx;if(nx>=0&&nx<n&&ny>=0&&ny<n&&!seen.has(id))choices.push([d,id]);}if(!choices.length){stack.pop();continue;}const [d,id]=choices[Math.floor(random()*choices.length)];cells[at][d]=false;cells[id][(d+2)%4]=false;seen.add(id);stack.push(id);}return cells;}
function stepPosition(cells,n,pos,d){if(cells[pos][d])return pos;return pos+DX[d]+DY[d]*n;}
const $=id=>document.getElementById(id),canvas=$('maze'),ctx=canvas.getContext('2d');let cells,n,level=1,difficulty=0,pos=0,moves=0,elapsed=0,lastTick=performance.now(),started=false,finished=false,visited=new Set(),records={};try{records=JSON.parse(localStorage.getItem('arcade-maze-records'))||{};if(typeof records!=='object'||Array.isArray(records))records={};}catch(e){}
function formatTime(ms){const sec=Math.floor(ms/1000);return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;}
function clock(now=performance.now()){if(started&&!finished&&!document.hidden)elapsed+=Math.max(0,now-lastTick);lastTick=now;$('time').textContent=formatTime(elapsed);}
function draw(){const size=600;const ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=size*ratio;canvas.height=size*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle='#202720';ctx.fillRect(0,0,size,size);const pad=12,cell=(size-pad*2)/n;ctx.lineWidth=Math.max(2,cell*.06);ctx.strokeStyle='#a49d80';ctx.lineCap='square';if($('trail').checked){ctx.fillStyle='#455239';visited.forEach(id=>{ctx.beginPath();ctx.arc(pad+(id%n+.5)*cell,pad+(Math.floor(id/n)+.5)*cell,cell*.1,0,Math.PI*2);ctx.fill();});}const ex=pad+(n-1)*cell,ey=pad+(n-1)*cell;ctx.fillStyle='#ead7ab';ctx.fillRect(ex+cell*.22,ey+cell*.22,cell*.56,cell*.56);ctx.fillStyle='#665e44';ctx.fillRect(ex+cell*.43,ey+cell*.35,cell*.15,cell*.32);ctx.beginPath();cells.forEach((walls,id)=>{const x=pad+(id%n)*cell,y=pad+Math.floor(id/n)*cell;if(walls[0]){ctx.moveTo(x,y);ctx.lineTo(x+cell,y);}if(walls[3]){ctx.moveTo(x,y);ctx.lineTo(x,y+cell);}if(id%n===n-1&&walls[1]){ctx.moveTo(x+cell,y);ctx.lineTo(x+cell,y+cell);}if(id>=n*(n-1)&&walls[2]){ctx.moveTo(x,y+cell);ctx.lineTo(x+cell,y+cell);}});ctx.stroke();ctx.fillStyle='#d2f86a';ctx.beginPath();ctx.arc(pad+(pos%n+.5)*cell,pad+(Math.floor(pos/n)+.5)*cell,cell*.27,0,Math.PI*2);ctx.fill();ctx.fillStyle='#36432a';ctx.beginPath();ctx.arc(pad+(pos%n+.57)*cell,pad+(Math.floor(pos/n)+.45)*cell,cell*.045,0,Math.PI*2);ctx.fill();canvas.setAttribute('aria-label',`${n} 乘 ${n} 迷宮，目前第 ${Math.floor(pos/n)+1} 列、第 ${pos%n+1} 格。出口在第 ${n} 列、第 ${n} 格。`);}
function updateRecord(){const r=records[n];$('record').textContent=r?`${n} × ${n} 最快紀錄：${formatTime(r)}（隨機地圖）`:'這個大小的最快紀錄，等你來留下。';}
function resetPlayer(){pos=0;moves=0;elapsed=0;lastTick=performance.now();started=false;finished=false;visited=new Set([0]);$('moves').textContent=0;$('time').textContent='00:00';$('level').textContent=level;$('overlay').hidden=true;$('status').textContent=`${n} × ${n} 迷宮：從左上角出發，前往右下角的出口`;updateRecord();draw();}
function newGame(){n=Math.min(24,[8,12,16][difficulty]+(level-1)*2);cells=generateMaze(n);resetPlayer();}
function move(d){if(finished)return;const next=stepPosition(cells,n,pos,d);if(next===pos){$('status').textContent='這裡有牆，試試另一個方向';return;}clock();started=true;pos=next;moves++;visited.add(pos);$('moves').textContent=moves;$('status').textContent=`目前第 ${Math.floor(pos/n)+1} 列、第 ${pos%n+1} 格`;draw();if(pos===n*n-1){clock();finished=true;if(!records[n]||elapsed<records[n]){records[n]=Math.max(1,Math.round(elapsed));try{localStorage.setItem('arcade-maze-records',JSON.stringify(records));}catch(e){}}$('result').textContent=`第 ${level} 關完成！用時 ${formatTime(elapsed)}，走了 ${moves} 步。`;$('status').textContent='恭喜找到出口！可以挑戰下一關了';$('overlay').hidden=false;updateRecord();}}
$('restart').onclick=resetPlayer;$('newMaze').onclick=newGame;$('next').onclick=()=>{level++;newGame();};$('difficulty').onchange=e=>{difficulty=Number(e.target.value);level=1;newGame();};$('trail').onchange=draw;document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(Number(b.dataset.dir)));document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.altKey||e.ctrlKey||e.metaKey)return;const map={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3};const d=map[e.key]??map[e.key.toLowerCase()];if(d!==undefined){e.preventDefault();move(d);}});let start=null;canvas.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointerup',e=>{if(!start||start.id!==e.pointerId)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));});canvas.addEventListener('pointercancel',()=>start=null);document.addEventListener('visibilitychange',()=>{lastTick=performance.now();});setInterval(clock,200);newGame();
</script></body></html>
