<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12141b"><title>記憶配對 · Arcade</title><style>
:root{color-scheme:dark;--bg:#12141b;--panel:#1b1e28;--line:#343947;--muted:#a5aaba;--lime:#d2f86a;--gold:#ffd790}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#3b3023,transparent 65%),var(--bg);color:#f4f5f8;font-family:system-ui,"Noto Sans TC",sans-serif;line-height:1.6}main{max-width:950px;margin:auto;padding:25px 24px 50px}a{color:var(--muted);text-decoration:none}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-weight:800;color:#fff}.brand span{color:var(--lime)}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:3px;margin:28px 0 8px}h1{margin:0;font-size:36px}p{color:var(--muted);margin:8px 0 20px}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--lime);outline-offset:3px}.game{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}label{font-size:13px;color:var(--muted)}select{font:inherit;color:#fff;background:#242936;border:1px solid #485063;border-radius:7px;padding:8px;margin-left:7px}.action{background:var(--lime);color:#202715;border:0;border-radius:8px;padding:9px 17px;font-weight:750}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}.stat{background:#242936;border-radius:9px;padding:10px 15px}.stat small{color:var(--muted);font-size:11px;display:block}.stat strong{font-size:23px}.board{display:grid;gap:11px;max-width:690px;margin:auto;grid-template-columns:repeat(var(--cols,4),1fr)}.card{aspect-ratio:1.12;position:relative;border:1px solid #685940;border-radius:11px;background:#353027;padding:0;perspective:600px;color:var(--gold);min-width:0}.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .32s}.card.open .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden}.back{background:repeating-linear-gradient(45deg,#ffffff04 0 2px,transparent 2px 13px),#353027;font-size:30px}.front{background:#ffd790;color:#4b3820;transform:rotateY(180deg);font-size:clamp(24px,5vw,43px)}.card.matched{border-color:#9dbe68}.card.matched .front{background:#c5dfa1}.card.matched:after{content:'✓';position:absolute;bottom:3px;right:7px;font-size:13px;color:#3e5b22}.card:disabled{cursor:default}.status{min-height:28px;text-align:center;color:var(--gold);font-size:14px;margin:20px 0 0}.win{margin:18px 0 0;padding:18px;text-align:center;border-radius:12px;background:#303727;border:1px solid #748f48}.win h2{margin:0;color:var(--lime);font-size:24px}.win p{margin:7px 0 0;color:#d6dec9}.rules{font-size:13px;line-height:1.9;margin-top:20px}.rules strong{color:#f4f5f8}[hidden]{display:none!important}@media(max-width:540px){main{padding:18px 15px 35px}.game{padding:14px}h1{font-size:30px}.stats{gap:6px}.stat{padding:8px}.stat strong{font-size:19px}.stat small{font-size:10px}.board{gap:7px;grid-template-columns:repeat(4,1fr)}.back{font-size:23px}.card{border-radius:8px}.face{border-radius:7px}select{max-width:165px}.toolbar{gap:8px}.action{padding:9px 12px;font-size:13px}}@media(prefers-reduced-motion:reduce){.card-inner{transition:none}}
</style></head><body><main><header><a class="brand" href="../index.html">arcade<span>.</span></a><a href="../index.html">← 遊戲大廳</a></header><div class="eyebrow">MEMORY / 04</div><h1>記憶配對</h1><p>翻一張，記一下。好記憶，也需要一點運氣。</p><section class="game" aria-label="記憶配對遊戲"><div class="toolbar"><label for="difficulty">挑戰難度<select id="difficulty"><option value="6">暖身 · 6 對</option><option value="8" selected>標準 · 8 對</option><option value="12">挑戰 · 12 對</option></select></label><button id="restart" class="action">重新開始</button></div><div class="stats"><div class="stat"><small>翻牌次數</small><strong id="moves">0</strong></div><div class="stat"><small>已配對</small><strong id="pairs">0 / 8</strong></div><div class="stat"><small>經過時間</small><strong id="time">0:00</strong></div><div class="stat"><small>最佳次數</small><strong id="best">—</strong></div></div><div class="board" id="board" aria-label="配對卡牌"></div><p id="status" class="status" role="status" aria-live="polite"></p><div id="win" class="win" hidden><h2>記得真漂亮！</h2><p id="summary"></p></div></section><p class="rules"><strong>玩法</strong>　每次翻開兩張，相同圖案就能配成一對。不同的圖案會在片刻後蓋回。找齊所有配對即獲勝，每翻兩張計 1 次。計時從第一張翻牌開始，沒有時間限制。<br>可使用滑鼠、手機輕點，或 Tab 搭配 Enter／空白鍵。切換難度會直接開始新局。</p><noscript><p>請啟用 JavaScript 以開始遊戲。</p></noscript></main><script>
'use strict';
const ICONS=[['🍋','檸檬'],['🍒','櫻桃'],['🍇','葡萄'],['🍓','草莓'],['🥝','奇異果'],['🍉','西瓜'],['🌻','向日葵'],['🌵','仙人掌'],['🐳','鯨魚'],['🦋','蝴蝶'],['🚀','火箭'],['⭐','星星']];
const $=id=>document.getElementById(id);let cards=[],opened=[],moves=0,matched=0,pairCount=8,locked=false,finished=false,startedAt=null,elapsed=0,flipTimer=null,clockTimer=null,generation=0,best=null;
function shuffle(values,random=Math.random){const result=values.slice();for(let i=result.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
function formatTime(seconds){return `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`}
function nowSeconds(){return startedAt===null?0:Math.floor((Date.now()-startedAt)/1000)}
function readBest(){try{const value=Number(localStorage.getItem(`arcade-memory-best-${pairCount}`));return Number.isFinite(value)&&value>=pairCount?value:null}catch(e){return null}}
function updateStats(){$('moves').textContent=moves;$('pairs').textContent=`${matched} / ${pairCount}`;$('time').textContent=formatTime(elapsed);$('best').textContent=best===null?'—':best}
function renderCard(index){const card=cards[index],button=$('board').children[index];button.className='card'+(card.matched?' matched':opened.includes(index)?' open':'');const visible=card.matched||opened.includes(index);button.setAttribute('aria-label',`卡牌 ${index+1}，${visible?ICONS[card.value][1]:'未翻開'}${card.matched?'，已配對':''}`);button.disabled=card.matched;button.setAttribute('aria-pressed',String(visible))}
function finish(){finished=true;locked=true;elapsed=nowSeconds();clearInterval(clockTimer);clockTimer=null;if(best===null||moves<best){best=moves;try{localStorage.setItem(`arcade-memory-best-${pairCount}`,String(best))}catch(e){}}updateStats();$('win').hidden=false;$('summary').textContent=`用 ${moves} 次翻牌、${formatTime(elapsed)} 找齊 ${pairCount} 對！`;$('status').textContent='全部配對成功！你可以再玩一次，或挑戰不同難度。'}
function flip(index){if(locked||finished||cards[index].matched||opened.includes(index))return;if(startedAt===null){startedAt=Date.now();clockTimer=setInterval(()=>{elapsed=nowSeconds();$('time').textContent=formatTime(elapsed)},250)}opened.push(index);renderCard(index);if(opened.length===1){$('status').textContent='記住這個圖案，再翻開另一張。';return}moves++;const [a,b]=opened;updateStats();if(cards[a].value===cards[b].value){cards[a].matched=cards[b].matched=true;matched++;opened=[];renderCard(a);renderCard(b);updateStats();$('status').textContent=`配對成功！已找到 ${matched} 對。`;if(matched===pairCount)finish()}else{locked=true;$('status').textContent='差一點！記住它們的位置。';const current=generation;flipTimer=setTimeout(()=>{if(current!==generation)return;opened=[];renderCard(a);renderCard(b);locked=false;flipTimer=null;$('status').textContent='再找找看，下一對在哪裡？'},950)}}
function restart(){generation++;clearTimeout(flipTimer);clearInterval(clockTimer);flipTimer=clockTimer=null;pairCount=Number($('difficulty').value);cards=shuffle(Array.from({length:pairCount},(_,i)=>i).flatMap(i=>[i,i])).map(value=>({value,matched:false}));opened=[];moves=matched=elapsed=0;locked=finished=false;startedAt=null;best=readBest();$('win').hidden=true;$('board').replaceChildren();$('board').style.setProperty('--cols',pairCount===12?6:4);cards.forEach((card,index)=>{const button=document.createElement('button');button.type='button';button.className='card';const inner=document.createElement('span');inner.className='card-inner';inner.setAttribute('aria-hidden','true');const back=document.createElement('span');back.className='face back';back.textContent='✦';const front=document.createElement('span');front.className='face front';front.textContent=ICONS[card.value][0];inner.append(back,front);button.append(inner);button.addEventListener('click',()=>flip(index));$('board').append(button);renderCard(index)});updateStats();$('status').textContent='準備好了嗎？翻開第一張卡牌吧。'}
$('restart').addEventListener('click',restart);$('difficulty').addEventListener('change',restart);window.addEventListener('pagehide',()=>{clearTimeout(flipTimer);clearInterval(clockTimer)});window.addEventListener('pageshow',e=>{if(e.persisted){if(locked&&!finished){opened=[];locked=false;cards.forEach((_,i)=>renderCard(i))}if(startedAt!==null&&!finished){clearInterval(clockTimer);clockTimer=setInterval(()=>{elapsed=nowSeconds();$('time').textContent=formatTime(elapsed)},250)}}});restart();
</script></body></html>
